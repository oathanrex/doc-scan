<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Crisp Light Rounded Squircle Base (Matches User Uploaded Viewfinder Icon) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#e2e8f0" stroke-width="6"/>

  <!-- 4 Optical Viewfinder Brackets (Teal) -->
  <g stroke="#0d9488" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 144 204 L 144 162 A 14 14 0 0 1 158 148 L 200 148"/>
    <!-- Top-Right -->
    <path d="M 312 148 L 354 148 A 14 14 0 0 1 368 162 L 368 204"/>
    <!-- Bottom-Left -->
    <path d="M 144 308 L 144 350 A 14 14 0 0 0 158 364 L 200 364"/>
    <!-- Bottom-Right -->
    <path d="M 312 364 L 354 364 A 14 14 0 0 0 368 350 L 368 308"/>
  </g>

  <!-- Centered Scanned Document Silhouette -->
  <!-- Document Outline -->
  <rect x="194" y="184" width="124" height="144" rx="24" fill="none" stroke="#0f766e" stroke-width="26"/>
  
  <!-- Central Document Scanline Divider -->
  <line x1="208" y1="256" x2="304" y2="256" stroke="#0d9488" stroke-width="20" stroke-linecap="round"/>
</svg>
